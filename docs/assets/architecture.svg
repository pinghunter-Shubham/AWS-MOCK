<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Central host-native AWS Mock architecture</title>
  <desc id="desc">Multiple applications use process environment variables and standard AWS SDK clients to connect to one Moto server, which emulates seven tested AWS services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <text x="60" y="57" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">Central Host-Native AWS Mock</text>
  <text x="60" y="86" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="16">Zero endpoint changes in application source code</text>
  <g filter="url(#shadow)"><rect x="60" y="130" width="220" height="78" rx="13" fill="#21262d" stroke="#30363d"/><rect x="60" y="232" width="220" height="78" rx="13" fill="#21262d" stroke="#30363d"/><rect x="60" y="334" width="220" height="58" rx="13" fill="#21262d" stroke="#30363d"/></g>
  <text x="170" y="160" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="18">Project A</text><text x="170" y="187" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="14">Python / boto3</text>
  <text x="170" y="262" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="18">Project B</text><text x="170" y="289" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="14">Java / Node.js / .NET</text>
  <text x="170" y="369" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="17">Additional projects</text>
  <path d="M280 169 H375" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><path d="M280 271 H375" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/><path d="M280 363 H337 Q360 363 360 340 V286 Q360 271 375 271" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="390" y="151" width="255" height="140" rx="16" fill="#1f2937" stroke="#58a6ff" stroke-width="2"/></g>
  <text x="518" y="187" text-anchor="middle" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="18">Process environment</text><text x="518" y="219" text-anchor="middle" fill="#f0f6fc" font-family="Consolas, monospace" font-size="14">AWS_ENDPOINT_URL</text><text x="518" y="244" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="13">http://127.0.0.1:4566</text><text x="518" y="271" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">fake credentials · us-east-1</text>
  <path d="M645 221 H723" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="738" y="130" width="190" height="182" rx="18" fill="#21262d" stroke="#f0883e" stroke-width="2"/></g>
  <text x="833" y="176" text-anchor="middle" fill="#f0883e" font-family="Segoe UI, Arial, sans-serif" font-size="22">Moto Server</text><text x="833" y="207" text-anchor="middle" fill="#f0f6fc" font-family="Consolas, monospace" font-size="14">127.0.0.1:4566</text><line x1="775" y1="229" x2="891" y2="229" stroke="#30363d"/><text x="833" y="256" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="14">readiness checks</text><text x="833" y="279" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="14">request recording</text><text x="833" y="302" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="14">state replay</text>
  <path d="M928 221 H985" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14"><rect x="1000" y="118" width="140" height="36" rx="9" fill="#1c352d"/><text x="1070" y="141" text-anchor="middle" fill="#7ee787">S3</text><rect x="1000" y="162" width="140" height="36" rx="9" fill="#1c352d"/><text x="1070" y="185" text-anchor="middle" fill="#7ee787">DynamoDB</text><rect x="1000" y="206" width="67" height="36" rx="9" fill="#1c352d"/><text x="1034" y="229" text-anchor="middle" fill="#7ee787">SQS</text><rect x="1073" y="206" width="67" height="36" rx="9" fill="#1c352d"/><text x="1107" y="229" text-anchor="middle" fill="#7ee787">SNS</text><rect x="1000" y="250" width="140" height="36" rx="9" fill="#1c352d"/><text x="1070" y="273" text-anchor="middle" fill="#7ee787">Secrets Manager</text><rect x="1000" y="294" width="67" height="36" rx="9" fill="#1c352d"/><text x="1034" y="317" text-anchor="middle" fill="#7ee787">STS</text><rect x="1073" y="294" width="67" height="36" rx="9" fill="#1c352d"/><text x="1107" y="317" text-anchor="middle" fill="#7ee787">Kinesis</text></g>
  <text x="1070" y="359" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">plus additional Moto APIs</text>
</svg>
