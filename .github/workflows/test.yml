name: Windows integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Moto and zero-code SDK integration
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            host-moto/requirements.txt
            examples/python-client/requirements.txt

      - name: Install central AWS Mock
        shell: pwsh
        run: .\host-moto\scripts\Install-AwsMock.ps1

      - name: Install independent client
        shell: pwsh
        run: .\examples\python-client\Install.ps1

      - name: Run central and zero-code integration tests
        shell: pwsh
        run: |
          try {
            .\host-moto\scripts\Start-AwsMock.ps1
            & .\host-moto\.venv\Scripts\python.exe .\host-moto\smoke_test.py
            if ($LASTEXITCODE -ne 0) { throw "Central smoke test failed." }

            .\examples\python-client\Run-Test.ps1
            if ($LASTEXITCODE -ne 0) { throw "Zero-code client test failed." }
          }
          finally {
            .\host-moto\scripts\Stop-AwsMock.ps1
          }
